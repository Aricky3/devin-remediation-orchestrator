name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devin-remediation-orchestrator:ci .
      - name: Smoke test (dry-run boot + metrics)
        run: |
          docker run -d --name orch -p 8000:8000 \
            -e DRY_RUN=true -e SCANNER_ENABLED=false \
            devin-remediation-orchestrator:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          curl -sf http://localhost:8000/metrics
          docker rm -f orch
